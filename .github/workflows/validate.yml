name: Validate

# Not on every push: a release is what users install, so that is what has to be valid. Pushes to
# main during a working session would otherwise mail a failure for every commit.
on:
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Home Assistant manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # The action reads the repository through the API rather than the checkout, so on a
          # private repository it needs a token or it sees no files at all.
          github_token: ${{ secrets.GITHUB_TOKEN }}
